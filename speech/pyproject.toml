[project]
name = "handfree-speech"
version = "0.1.0"
description = "Local speech-to-text and text-to-speech sidecar for handfree"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pywhispercpp>=1.3",
  "kokoro-onnx>=0.4",
  "numpy",
  "soundfile",
  "onnxruntime",
  "transformers",  # only its Whisper feature extractor, for the turn model
  # Apple Silicon: GPU text-to-speech (Qwen3-TTS etc.); other platforms use Kokoro ONNX
  "mlx-audio>=0.5.9; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sentencepiece; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sherpa-onnx>=2.0.1",
]
